<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>PUBG Writer — 대필 자동화</title>

    <meta
        name="description"
        content="대필 작업을 더 빠르고 간단하게. PUBG Writer"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     LANDING
===================================================== -->

<main id="landingPage">

    <!-- Header -->
    <header class="landing-header">

        <button class="brand" onclick="showLanding()">
            <span class="brand-mark">
                <span></span>
                <span></span>
            </span>

            <span class="brand-name">
                PUBG Writer
            </span>
        </button>

        <div class="header-status">
            <span class="status-dot"></span>
            <span>대필 자동화</span>
        </div>

    </header>


    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">

            <div class="eyebrow">
                <span class="eyebrow-line"></span>
                PUBG WRITER
                <span class="eyebrow-line"></span>
            </div>

            <h1>
                대필을
                <br>
                <span class="serif">더 쉽게.</span>
            </h1>

            <p class="hero-description">
                반복되는 대필 작업을 간단하게.<br>
                필요한 내용을 빠르게 작성하고 정리하세요.
            </p>

            <button
                id="startButton"
                class="start-button"
                onclick="startWriter()"
            >
                <span>사용해보기</span>

                <span class="button-arrow">
                    →
                </span>
            </button>

            <div class="hero-note">
                다운로드 없이 바로 사용할 수 있습니다.
            </div>

        </div>


        <!-- Bottom subtle decoration -->
        <div class="hero-bottom">

            <div class="scroll-indicator">
                <span></span>
            </div>

            <span>
                WRITE · ORGANIZE · CREATE
            </span>

        </div>

    </section>


    <!-- Ambient background -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

</main>



<!-- =====================================================
     WRITER APP
===================================================== -->

<main id="appPage" class="app-page hidden">

    <header class="app-topbar">

        <button
            class="app-back"
            onclick="showLanding()"
            aria-label="처음으로"
        >
            <span>←</span>
        </button>

        <div class="app-title">
            <span class="app-logo"></span>
            PUBG Writer
        </div>

        <div class="app-actions">

            <button id="resetBtn" class="top-action">
                초기화
            </button>

            <button id="exportBtn" class="top-action primary">
                내보내기
            </button>

        </div>

    </header>


    <!-- Main workspace -->
    <section class="workspace">

        <div id="canvasHolder" class="canvas-holder">

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    +
                </div>

                <h2>
                    대필할 이미지를 추가하세요
                </h2>

                <p>
                    이미지를 선택하면 대필 작업을 시작할 수 있습니다.
                </p>

                <label class="upload-button">
                    이미지 선택
                    <input
                        id="fileInput"
                        type="file"
                        accept="image/*"
                        hidden
                    >
                </label>

            </div>

            <canvas id="mainCanvas"></canvas>

            <div
                id="overlayBar"
                class="overlay-bar"
            >
                <button id="selectAllBtn">
                    전체 선택
                </button>

                <button id="clearSelBtn">
                    선택 해제
                </button>

                <span class="selection-info">
                    <b id="selCount">0</b>
                    /
                    <span id="totalCount">0</span>
                </span>
            </div>

        </div>


        <!-- Crop -->
        <section class="crop-section">

            <div class="section-header">
                <div>
                    <span class="section-label">
                        CROP
                    </span>

                    <span id="cropHint">
                        영역을 선택하세요
                    </span>
                </div>
            </div>

            <div
                id="cropStrip"
                class="crop-strip"
            ></div>

        </section>

    </section>



    <!-- Bottom navigation -->
    <nav class="bottom-tabbar">

        <button
            class="tab-btn active"
            data-tab="grid"
        >
            <span class="tab-icon">▦</span>
            <span>그리드</span>
        </button>

        <button
            class="tab-btn"
            data-tab="label"
        >
            <span class="tab-icon">T</span>
            <span>라벨</span>
        </button>

        <button
            class="tab-btn"
            data-tab="template"
        >
            <span class="tab-icon">□</span>
            <span>템플릿</span>
        </button>

    </nav>



    <!-- Sheet backdrop -->
    <div
        id="sheetBackdrop"
        class="sheet-backdrop"
    ></div>


    <!-- Bottom Sheet -->
    <section
        id="sheet"
        class="sheet"
    >

        <div class="sheet-handle"></div>


        <!-- GRID -->
        <div class="sheet-content">

            <div class="control-group">

                <label>
                    열
                    <input
                        id="colsInput"
                        type="number"
                        min="1"
                        max="20"
                        value="3"
                    >
                </label>

                <label>
                    행
                    <input
                        id="rowsInput"
                        type="number"
                        min="1"
                        max="20"
                        value="3"
                    >
                </label>

            </div>


            <div class="slider-group">

                <label>
                    가로 오프셋
                    <input
                        id="offXSlider"
                        type="range"
                        min="-100"
                        max="100"
                        value="0"
                    >
                </label>

                <label>
                    세로 오프셋
                    <input
                        id="offYSlider"
                        type="range"
                        min="-100"
                        max="100"
                        value="0"
                    >
                </label>

            </div>


            <!-- Label -->
            <div class="label-controls">

                <input
                    id="labelText"
                    type="text"
                    placeholder="라벨 입력"
                >

                <div
                    id="colorRow"
                    class="color-row"
                ></div>

                <label>
                    글자 크기
                    <input
                        id="fontSizeSlider"
                        type="range"
                        min="8"
                        max="72"
                        value="24"
                    >
                </label>

                <label class="toggle-row">

                    <span>
                        외곽선
                    </span>

                    <input
                        id="outlineToggle"
                        type="checkbox"
                    >

                </label>

                <button
                    id="applyLabelBtn"
                    class="apply-button"
                >
                    라벨 적용
                </button>

            </div>


            <!-- Template -->
            <div class="template-controls">

                <input
                    id="templateName"
                    type="text"
                    placeholder="템플릿 이름"
                >

                <button id="saveTemplateBtn">
                    저장
                </button>

                <div id="templateList"></div>

            </div>

        </div>

    </section>



</main>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script src="script.js"></script>

<script>
/*
===========================================================
Landing ↔ Writer transition
===========================================================
*/

function startWriter() {

    const landing = document.getElementById("landingPage");
    const app = document.getElementById("appPage");

    if (!landing || !app) return;

    landing.classList.add("leaving");

    setTimeout(() => {

        landing.classList.add("hidden");

        app.classList.remove("hidden");

        requestAnimationFrame(() => {
            app.classList.add("visible");
        });

        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }, 450);
}


function showLanding() {

    const landing = document.getElementById("landingPage");
    const app = document.getElementById("appPage");

    if (!landing || !app) return;

    app.classList.remove("visible");

    setTimeout(() => {

        app.classList.add("hidden");

        landing.classList.remove("hidden");
        landing.classList.remove("leaving");

        requestAnimationFrame(() => {
            landing.classList.add("returning");
        });

        setTimeout(() => {
            landing.classList.remove("returning");
        }, 800);

        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }, 350);
}
</script>

</body>
</html>
